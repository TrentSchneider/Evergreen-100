<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Evergreen 100</title>

    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- =========================================================
       FLOATING SUMMARY PILL — NESTED DRAWER VERSION
       ========================================================= -->
    <div id="summary-container">
      <div id="summary-pill">
        <!-- Pill top row -->
        <div class="pill-top">
          <div class="pill-progress">
            <div class="pill-progress-fill"></div>
          </div>
          <div class="pill-percent">0%</div>
        </div>

        <!-- Drawer nested inside pill -->
        <div id="summary-drawer">
          <div class="scroll-shadow top"></div>
          <div class="scroll-shadow bottom"></div>
          <div class="drawer-scroll">
            <div id="summary-drawer-content"></div>

            <div data-summary="history" class="summary-history">
              <div class="history-section">
                <div class="history-title">Streak</div>
                <div data-history="streak" class="history-value">0 days</div>
              </div>

              <div class="history-section">
                <div class="history-title">Yesterday</div>
                <div data-history="yesterday" class="history-value">—</div>
              </div>

              <div class="history-section">
                <div class="history-title">Recent Days</div>
                <div data-history="list" class="history-list"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- =========================================================
       MAIN CONTENT — TIERS + SETTINGS
       ========================================================= -->

    <div id="tiers-container"></div>

    <div class="card settings-card">
      <div class="settings-header">
        <div class="settings-title">Settings</div>
        <div id="settings-toggle">▼</div>
      </div>

      <div id="settings-body" class="settings-body hidden">
        <!-- Theme Toggle -->
        <div class="theme-card">
          <div class="theme-toggle">
            <button class="theme-option" data-theme="auto">Auto</button>
            <button class="theme-option" data-theme="light">Light</button>
            <button class="theme-option" data-theme="dark">Dark</button>

            <div id="theme-highlight" class="theme-highlight"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Reset Button -->
    <button data-reset="trigger" class="reset-btn">Reset Progress</button>

    <!-- Reset Alert -->
    <div data-reset="overlay" class="reset-overlay hidden">
      <div class="reset-dialog">
        <div class="reset-title">Reset Progress?</div>
        <div class="reset-message">
          This will set all exercises back to zero.<br />
          Are you sure you want to continue?
        </div>

        <div class="reset-actions">
          <button data-reset="cancel" class="reset-cancel">Cancel</button>
          <button data-reset="confirm" class="reset-confirm">Yes, Reset</button>
        </div>
      </div>
    </div>

    <!-- =========================================================
       SCRIPT
       ========================================================= -->
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
